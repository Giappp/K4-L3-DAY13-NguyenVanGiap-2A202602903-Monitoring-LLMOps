service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: SLO 99.5% trong cửa sổ 28 ngày tương ứng error budget 0.5%. Dựa trên baseline latency P95 (~500-1500ms), ngưỡng latency_ms <= 3000ms bảo đảm trải nghiệm người dùng tốt và đủ headroom cho tail latency. Nếu hệ thống xử lý 10,000 request trong 28 ngày, ngân sách lỗi cho phép tối đa 50 request bị lỗi hoặc vượt quá 3000ms.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
